<!DOCTYPE html>
<html lang="es">
  
<head>
  <meta charset="UTF-8">
  <title>Generador de Contraseñas Seguras Online Gratis</title>
  <meta name="description" content="Genera contraseñas seguras, aleatorias y fuertes en segundos. Herramienta gratuita y rápida.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

  <script src="https://pl28696297.effectivegatecpm.com/82/bd/cf/82bdcfc433077e5494582782c05cf1d3.js"></script>
  
<body>

<div class="background"></div>

<div class="container">
  <h1>🔐 Generador de Contraseñas</h1>
  <p class="subtitle">Crea contraseñas ultra seguras en segundos</p>

  <div class="password-box">
    <input type="text" id="password" readonly>
    <button id="copyBtn">Copiar</button>
  </div>

  <div class="options">

    <div class="option">
      <label>Longitud: <span id="lengthValue">16</span></label>
      <input type="range" id="length" min="6" max="32" value="16">
    </div>

    <div class="checkbox-group">
      <label><input type="checkbox" id="uppercase" checked> Mayúsculas</label>
      <label><input type="checkbox" id="lowercase" checked> Minúsculas</label>
      <label><input type="checkbox" id="numbers" checked> Números</label>
      <label><input type="checkbox" id="symbols"> Símbolos</label>
    </div>

  </div>

  <div class="strength-meter">
    <div id="strengthBar"></div>
  </div>
  <p id="strengthText">Seguridad: Alta</p>

  <button id="generateBtn" class="generate">Generar contraseña</button>

</div>

<script src="script.js"></script>
</body>
</html>
